name: Cleanup - Development

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete preview Worker
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-env
      - name: Delete preview Worker
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          WORKER_NAME: pr-${{ github.event.pull_request.number }}-biancafiore-development
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 10
          shell: bash
          command: |
            output=$(pnpm exec wrangler delete "$WORKER_NAME" --force 2>&1) && { echo "$output"; exit 0; }
            echo "$output"
            echo "$output" | grep -qi "does not exist" && exit 0
            exit 1
