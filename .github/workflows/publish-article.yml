name: Publish Article

run-name: >-
  ${{ github.event.action == 'article-published'
      && format('Article "{0}" published (publish triggered by Contentful Webhook)', github.event.client_payload.title)
      || format('Article ({0}) unpublished (publish triggered by Contentful Webhook)', github.event.client_payload.id) }}

on:
  repository_dispatch:
    types: [article-published, article-unpublished]

permissions: {}

jobs:
  publish:
    name: Redeploy production through CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REASON: ${{ github.event.action == 'article-published' && format('article "{0}" published', github.event.client_payload.title) || format('article ({0}) unpublished', github.event.client_payload.id) }}
    steps:
      - name: Dispatch the CI workflow on main
        run: gh workflow run ci.yml --ref main -f reason="$REASON"
