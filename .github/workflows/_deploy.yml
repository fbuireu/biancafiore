name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: >-
          The GitHub Environment. The wrangler environment is its last dash-separated
          segment, derived here rather than passed, so a caller cannot pair the two wrongly.
      url:
        required: false
        type: string
      worker_name:
        required: false
        type: string
        description: Override the worker name (for per-PR preview deployments)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      GOOGLE_RECAPTCHA_SECRET_KEY:
        required: true
      RESEND_API_KEY:
        required: true
      EMDASH_ENCRYPTION_KEY:
        required: false
      EMDASH_OAUTH_GOOGLE_CLIENT_ID:
        required: false
      EMDASH_OAUTH_GOOGLE_CLIENT_SECRET:
        required: false
      ASTRO_DB_REMOTE_URL:
        required: true
      ASTRO_DB_APP_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.worker_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      BIANCA_EMAIL: ${{ vars.BIANCA_EMAIL }}
      TWITTER_HANDLE: ${{ vars.TWITTER_HANDLE }}
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      GOOGLE_TAG_MANAGER_ID: ${{ vars.GOOGLE_TAG_MANAGER_ID }}
      GOOGLE_RECAPTCHA_SITE_KEY: ${{ vars.GOOGLE_RECAPTCHA_SITE_KEY }}
      BETTER_STACK_TRACKING_TOKEN: ${{ vars.BETTER_STACK_TRACKING_TOKEN }}
      HIDE_CHROME: ${{ vars.HIDE_CHROME || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prepare-env
      - name: Resolve the wrangler environment from the GitHub Environment
        id: stage
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "wrangler_env=${ENVIRONMENT##*-}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          CLOUDFLARE_ENV: ${{ steps.stage.outputs.wrangler_env }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_RECAPTCHA_SECRET_KEY: ${{ secrets.GOOGLE_RECAPTCHA_SECRET_KEY }}
          ASTRO_DB_REMOTE_URL: ${{ secrets.ASTRO_DB_REMOTE_URL }}
          ASTRO_DB_APP_TOKEN: ${{ secrets.ASTRO_DB_APP_TOKEN }}
        run: pnpm build
      - name: Verify the built output
        env:
          CLOUDFLARE_ENV: ${{ steps.stage.outputs.wrangler_env }}
        run: pnpm exec vitest run --project built
      - name: Collect the Worker secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_RECAPTCHA_SECRET_KEY: ${{ secrets.GOOGLE_RECAPTCHA_SECRET_KEY }}
          EMDASH_ENCRYPTION_KEY: ${{ secrets.EMDASH_ENCRYPTION_KEY }}
          EMDASH_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.EMDASH_OAUTH_GOOGLE_CLIENT_ID }}
          EMDASH_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.EMDASH_OAUTH_GOOGLE_CLIENT_SECRET }}
          ASTRO_DB_REMOTE_URL: ${{ secrets.ASTRO_DB_REMOTE_URL }}
          ASTRO_DB_APP_TOKEN: ${{ secrets.ASTRO_DB_APP_TOKEN }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          node -e "
          const required = ['RESEND_API_KEY','GOOGLE_RECAPTCHA_SECRET_KEY','ASTRO_DB_REMOTE_URL','ASTRO_DB_APP_TOKEN'];
          const optional = ['EMDASH_ENCRYPTION_KEY','EMDASH_OAUTH_GOOGLE_CLIENT_ID','EMDASH_OAUTH_GOOGLE_CLIENT_SECRET'];
          const missing = required.filter(k => !process.env[k]);
          if (missing.length) { console.error('Missing required secrets: ' + missing.join(', ')); process.exit(1); }
          const present = [...required, ...optional.filter(k => process.env[k])];
          const body = JSON.stringify(Object.fromEntries(present.map(k => [k, process.env[k]])));
          require('node:fs').writeFileSync(process.env.SECRETS_FILE, body, { mode: 0o600 });
          "
      - name: Deploy to Cloudflare Workers
        env:
          INPUTS_WORKER_NAME: ${{ inputs.worker_name }}
          WRANGLER_ENV: ${{ steps.stage.outputs.wrangler_env }}
          DEPLOY_MESSAGE: ${{ github.sha }}-${{ github.event_name }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          NAME_FLAG=""
          if [ -n "${INPUTS_WORKER_NAME}" ]; then
            NAME_FLAG="--name ${INPUTS_WORKER_NAME}"
          fi
          pnpm exec wrangler deploy --env "$WRANGLER_ENV" --message "$DEPLOY_MESSAGE" --secrets-file "$SECRETS_FILE" $NAME_FLAG
      - name: Remove the secrets file
        if: always()
        env:
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: rm -f "$SECRETS_FILE"
