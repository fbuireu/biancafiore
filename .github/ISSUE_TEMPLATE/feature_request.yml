name: Feature Request
description: Suggest an idea or enhancement for the site
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! This is a personal site, so not every idea will land — but well-argued ones are always read.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this solve, or what would it improve?
      placeholder: As a reader, I find it hard to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions you've considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a PR to implement this feature
