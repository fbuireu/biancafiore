name = "biancafiore"
main = "./src/worker.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2026-03-12"

[vars]
EMDASH_SITE_URL = "https://biancafiore.me"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
destinations = ["biancafiore-web-production-logs"]

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["biancafiore-web-production-traces"]

[cache]
enabled = true

[assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "drop-trailing-slash"

[[kv_namespaces]]
binding = "SESSION"
id = "c9f2626f1a4043c0aea8a75985bdc0a1"
preview_id = "fde64789020f4160b0d835d190d8d5d6"

[[d1_databases]]
binding = "DB"
database_name = "biancafiore-content-production"
database_id = "a7433220-eb9b-4121-9e6e-0b4f3097a768"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "biancafiore-media-production"

[triggers]
crons = ["* * * * *"]

[env.development]
name = "biancafiore-development"

[env.development.vars]
EMDASH_SITE_URL = "https://biancafiore-development.fbuireu.workers.dev"

[env.development.observability]
enabled = true
redact_query_string = true

[env.development.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
destinations = ["biancafiore-web-development-logs"]

[env.development.observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["biancafiore-web-development-traces"]

[[env.development.kv_namespaces]]
binding = "SESSION"
id = "fde64789020f4160b0d835d190d8d5d6"

[[env.development.d1_databases]]
binding = "DB"
database_name = "biancafiore-content-development"
database_id = "62582521-e769-4bba-8fc4-c914bfc53e7c"

[[env.development.r2_buckets]]
binding = "MEDIA"
bucket_name = "biancafiore-media-development"

[env.development.triggers]
crons = []

[env.production]
name = "biancafiore"

[env.production.vars]
EMDASH_SITE_URL = "https://biancafiore.me"

[env.production.observability]
enabled = true
redact_query_string = true

[env.production.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
destinations = ["biancafiore-web-production-logs"]

[env.production.observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["biancafiore-web-production-traces"]

[[env.production.kv_namespaces]]
binding = "SESSION"
id = "c9f2626f1a4043c0aea8a75985bdc0a1"

[[env.production.d1_databases]]
binding = "DB"
database_name = "biancafiore-content-production"
database_id = "a7433220-eb9b-4121-9e6e-0b4f3097a768"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "biancafiore-media-production"

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.routes]]
pattern = "biancafiore.me"
custom_domain = true
